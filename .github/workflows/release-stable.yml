name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string
      commit:
        description: "Full commit SHA on main to release (empty: main as it is when the job starts)"
        required: false
        type: string

permissions:
  contents: write

# One stable release at a time, so a failed run's cleanup never overlaps another
# run. A run dispatched while one is in progress waits, but GitHub keeps only
# the newest waiting run and cancels any older one.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.event.inputs.version }}
      tag_push_attempted: ${{ steps.tag.outputs.push_attempted }}
      commit: ${{ steps.tag.outputs.commit }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.commit || 'main' }}

      # A pinned commit is what was reviewed; refusing anything not on main keeps
      # a typo or a branch-only commit from being released.
      - name: Validate commit
        if: github.event.inputs.commit != ''
        shell: bash
        env:
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full 40-character SHA: $COMMIT" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "commit $COMMIT is not on main" >&2
            exit 1
          fi

      # Go version comes from go.mod's `go` directive; see ci.yml for why it lives there.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail

          version="${{ github.event.inputs.version }}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi

          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "tag already exists: $version" >&2
            exit 1
          fi

      - name: Run tests
        run: make test

      - name: Validate AWS release config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ vars.AWS_ROLE_ARN }}" ]]; then
            echo "missing GitHub Actions variable AWS_ROLE_ARN" >&2
            exit 1
          fi

      - name: Install GoReleaser
        run: .github/scripts/install-goreleaser.sh

      - name: Create git tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          version="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated with this run's ID: cleanup-failed-release.sh deletes a tag
          # only when its message names the run that is cleaning up.
          git tag -a "$version" -m "Release ${version} by GitHub Actions run ${GITHUB_RUN_ID}"
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "push_attempted=true" >> "$GITHUB_OUTPUT"
          git push origin "$version"

      - name: Resolve previous stable tag
        shell: bash
        run: |
          set -euo pipefail

          # GoReleaser defaults the changelog baseline to the previous tag of any
          # kind. Dev prereleases used to be minted per merge, so that baseline
          # was routinely a dev tag cut minutes earlier and the notes covered a
          # commit or two instead of the release. Pin it to the previous *stable*
          # tag so the range is the release, whoever cuts it.
          version="${{ github.event.inputs.version }}"
          prev="$(git tag --list 'v*' --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | grep -vFx "$version" \
                    | head -n 1)"
          if [ -z "$prev" ]; then
            # First stable release: leave the override unset rather than passing
            # an empty one. GoReleaser documents the env var as an override but
            # not what an empty value means, and this is not the place to find out.
            echo "no previous stable tag; leaving GoReleaser's own baseline in place"
          else
            echo "changelog baseline: $prev"
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          fi

      - name: Run GoReleaser
        run: goreleaser release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.inputs.version }}
          # GORELEASER_PREVIOUS_TAG is exported by the step above, and only when a
          # previous stable tag exists.

      - name: Record this run's draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Assigned first: a failed command substitution inside echo would not
          # fail the step.
          release_id="$(.github/scripts/find-run-draft.sh "${{ github.event.inputs.version }}" "$GITHUB_RUN_ID")"
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"

  # A job rather than a step: a cancelled job skips its remaining steps, but a
  # dependent job with always() still runs. The script decides from the repo's
  # actual state what, if anything, to delete.
  cleanup-failed-release:
    needs: release
    if: always() && needs.release.result != 'success' && needs.release.outputs.tag_push_attempted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Remove the tag and any draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/cleanup-failed-release.sh "${{ needs.release.outputs.tag }}" "${{ needs.release.outputs.commit }}" "${{ github.run_id }}"

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By the ID the release job recorded, never by tag, so only this run's
      # draft can be published.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --jq '"published \(.tag_name) (draft=\(.draft), prerelease=\(.prerelease))"'

  # A separate job so that, once the GitHub release is public, a failed CDN
  # publish is retried with "Re-run failed jobs" rather than by deleting a
  # release users can already see. It publishes the release's own assets.
  publish-cdn:
    needs: [release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Download and verify the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          gh release download "$TAG" --dir dist --pattern 'heygen_*' --pattern checksums.txt
          (cd dist && sha256sum -c checksums.txt)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Upload stable release artifacts to S3
        shell: bash
        env:
          TAG: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          tag="$TAG"

          # Upload immutable artifacts first.
          aws s3 cp dist/ "s3://heygen-public/cli/releases/${tag}/" \
            --recursive \
            --exclude "*" \
            --include "heygen_*.tar.gz" \
            --include "heygen_*.zip" \
            --include "checksums.txt" \
            --cache-control "public, max-age=31536000, immutable"

          # Upload the installer before flipping the stable pointer.
          aws s3 cp scripts/install.sh "s3://heygen-public/cli/install.sh" \
            --content-type "text/plain" \
            --cache-control "public, max-age=300"

          # Activate the release last so clients never observe a partial rollout.
          echo -n "${tag}" > /tmp/version-pointer
          aws s3 cp /tmp/version-pointer "s3://heygen-public/cli/stable" \
            --content-type "text/plain" \
            --cache-control "public, max-age=60"
