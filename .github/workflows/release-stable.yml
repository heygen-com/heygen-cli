name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string
      commit:
        description: "Full commit SHA on main to release (empty: main as it is when the job starts)"
        required: false
        type: string

permissions: {}

# One stable release at a time, so a failed run's cleanup never overlaps another
# run. A run dispatched while one is in progress waits, but GitHub keeps only
# the newest waiting run and cancels any older one.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.version }}
      tag_push_attempted: ${{ steps.tag.outputs.push_attempted }}
      commit: ${{ steps.tag.outputs.commit }}
      release_id: ${{ steps.draft.outputs.id }}
      checksums_sha256: ${{ steps.checksums.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] pushes or deletes the release tag
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.commit || 'main' }}

      # A pinned commit is what was reviewed; refusing anything not on main keeps
      # a typo or a branch-only commit from being released.
      - name: Validate commit
        if: github.event.inputs.commit != ''
        shell: bash
        env:
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full 40-character SHA: $COMMIT" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "commit $COMMIT is not on main" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$COMMIT" ]]; then
            echo "checked out $(git rev-parse HEAD), not $COMMIT" >&2
            exit 1
          fi
          # An older commit would ship older code under a newer version.
          last_stable="$(git tag --list 'v*' --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n 1)"
          if [[ -n "$last_stable" ]] && ! git merge-base --is-ancestor "$last_stable" "$COMMIT"; then
            echo "commit $COMMIT is older than the last stable release $last_stable" >&2
            exit 1
          fi
          # The rest of this job and the cleanup job run the pinned commit's release
          # scripts and GoReleaser config under this workflow file, so they must match it.
          if ! git diff --quiet "$COMMIT" "$GITHUB_SHA" -- .github/scripts .goreleaser.yaml; then
            echo "commit $COMMIT has different release scripts or GoReleaser config than this workflow ($GITHUB_SHA); release a newer commit" >&2
            exit 1
          fi

      # Go version comes from go.mod's `go` directive; see ci.yml for why it lives there.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # A release builds from a clean module and build cache, never one that
          # another run on main could have written.
          cache: false

      # The input reaches scripts only through env and is checked before any
      # use. Later steps and jobs read this step's output, never the raw input.
      - name: Validate version
        id: version
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'invalid version: %q\n' "$VERSION" >&2
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "tag already exists: $VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: make test

      - name: Validate AWS release config
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "missing GitHub Actions variable AWS_ROLE_ARN" >&2
            exit 1
          fi

      - name: Install GoReleaser
        run: .github/scripts/install-goreleaser.sh

      - name: Create git tag
        id: tag
        shell: bash
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated with this run's ID: cleanup-failed-release.sh deletes a tag
          # only when its message names the run that is cleaning up.
          git tag -a "$version" -m "Release ${version} by GitHub Actions run ${GITHUB_RUN_ID}"
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "push_attempted=true" >> "$GITHUB_OUTPUT"
          git push origin "$version"

      - name: Resolve previous stable tag
        shell: bash
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # GoReleaser defaults the changelog baseline to the previous tag of any
          # kind. Dev prereleases used to be minted per merge, so that baseline
          # was routinely a dev tag cut minutes earlier and the notes covered a
          # commit or two instead of the release. Pin it to the previous *stable*
          # tag so the range is the release, whoever cuts it.
          prev="$(git tag --list 'v*' --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | grep -vFx "$version" \
                    | head -n 1)"
          if [ -z "$prev" ]; then
            # First stable release: leave the override unset rather than passing
            # an empty one. GoReleaser documents the env var as an override but
            # not what an empty value means, and this is not the place to find out.
            echo "no previous stable tag; leaving GoReleaser's own baseline in place"
          else
            echo "changelog baseline: $prev"
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          fi

      - name: Run GoReleaser
        run: goreleaser release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
          # GORELEASER_PREVIOUS_TAG is exported by the step above, and only when a
          # previous stable tag exists.

      # Job outputs cannot be changed once this job ends, so publish-cdn can tell
      # the release's assets from replacements uploaded later.
      - name: Record the checksums digest
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum dist/checksums.txt | cut -d' ' -f1)"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Record this run's draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Assigned first: a failed command substitution inside echo would not
          # fail the step.
          release_id="$(.github/scripts/find-run-draft.sh "$VERSION" "$GITHUB_RUN_ID")"
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"

  # A job rather than a step: a cancelled job skips its remaining steps, but a
  # dependent job with always() still runs. The script decides from the repo's
  # actual state what, if anything, to delete.
  cleanup-failed-release:
    needs: release
    if: always() && needs.release.result != 'success' && needs.release.outputs.tag_push_attempted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] pushes or deletes the release tag
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Remove the tag and any draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: .github/scripts/cleanup-failed-release.sh "$TAG" "$COMMIT" "$GITHUB_RUN_ID"

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By the ID the release job recorded, never by tag, so only this run's
      # draft can be published.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --jq '"published \(.tag_name) (draft=\(.draft), prerelease=\(.prerelease))"'

  # A separate job so that, once the GitHub release is public, a failed CDN
  # publish is retried with "Re-run failed jobs" rather than by deleting a
  # release users can already see. It publishes only what the release job built:
  # the installer from its commit and the assets of the release it recorded,
  # never whatever the tag or a release of that name holds when this job runs.
  publish-cdn:
    needs: [release, publish-release]
    runs-on: ubuntu-latest
    environment: cli-release
    permissions:
      contents: read
      id-token: write
    env:
      S3_CLI_PREFIX: s3://heygen-public/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false

      - name: Check the tag still points at the built commit
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          set -euo pipefail

          tagged="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [[ "$tagged" != "$COMMIT" ]]; then
            echo "::error::${TAG} points at ${tagged:-nothing}, not the built commit ${COMMIT}"
            exit 1
          fi

      - name: Download and verify the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          CHECKSUMS_SHA256: ${{ needs.release.outputs.checksums_sha256 }}
        run: .github/scripts/download-release-assets.sh "$RELEASE_ID" "$TAG" "$CHECKSUMS_SHA256" dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Refuse to roll the CDN back
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: .github/scripts/check-cdn-publish.sh "$TAG" dist/checksums.txt

      - name: Upload stable release artifacts to S3
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          tag="$TAG"

          # Upload immutable artifacts first.
          aws s3 cp dist/ "${S3_CLI_PREFIX}/releases/${tag}/" \
            --recursive \
            --exclude "*" \
            --include "heygen_*.tar.gz" \
            --include "heygen_*.zip" \
            --include "checksums.txt" \
            --cache-control "public, max-age=31536000, immutable"

          # Upload the installer before flipping the stable pointer.
          aws s3 cp scripts/install.sh "${S3_CLI_PREFIX}/install.sh" \
            --content-type "text/plain" \
            --cache-control "public, max-age=300"

          # Activate the release last so clients never observe a partial rollout.
          echo -n "${tag}" > /tmp/version-pointer
          aws s3 cp /tmp/version-pointer "${S3_CLI_PREFIX}/stable" \
            --content-type "text/plain" \
            --cache-control "public, max-age=60"
