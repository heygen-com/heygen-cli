name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      # Go version comes from go.mod's `go` directive; see ci.yml for why it lives there.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail

          version="${{ github.event.inputs.version }}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi

          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "tag already exists: $version" >&2
            exit 1
          fi

      - name: Run tests
        run: make test

      - name: Validate AWS release config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ vars.AWS_ROLE_ARN }}" ]]; then
            echo "missing GitHub Actions variable AWS_ROLE_ARN" >&2
            exit 1
          fi

      - name: Install GoReleaser
        run: .github/scripts/install-goreleaser.sh

      - name: Create git tag
        shell: bash
        run: |
          set -euo pipefail

          version="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$version"
          git push origin "$version"

      - name: Resolve previous stable tag
        shell: bash
        run: |
          set -euo pipefail

          # GoReleaser defaults the changelog baseline to the previous tag of any
          # kind. Dev prereleases used to be minted per merge, so that baseline
          # was routinely a dev tag cut minutes earlier and the notes covered a
          # commit or two instead of the release. Pin it to the previous *stable*
          # tag so the range is the release, whoever cuts it.
          version="${{ github.event.inputs.version }}"
          prev="$(git tag --list 'v*' --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                    | grep -vFx "$version" \
                    | head -n 1)"
          if [ -z "$prev" ]; then
            # First stable release: leave the override unset rather than passing
            # an empty one. GoReleaser documents the env var as an override but
            # not what an empty value means, and this is not the place to find out.
            echo "no previous stable tag; leaving GoReleaser's own baseline in place"
          else
            echo "changelog baseline: $prev"
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          fi

      - name: Run GoReleaser
        run: goreleaser release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.inputs.version }}
          # GORELEASER_PREVIOUS_TAG is exported by the step above, and only when a
          # previous stable tag exists.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Upload stable release artifacts to S3
        shell: bash
        env:
          TAG: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          tag="$TAG"

          # Upload immutable artifacts first.
          aws s3 cp dist/ "s3://heygen-public/cli/releases/${tag}/" \
            --recursive \
            --exclude "*" \
            --include "heygen_*.tar.gz" \
            --include "heygen_*.zip" \
            --include "checksums.txt" \
            --cache-control "public, max-age=31536000, immutable"

          # Upload the installer before flipping the stable pointer.
          aws s3 cp scripts/install.sh "s3://heygen-public/cli/install.sh" \
            --content-type "text/plain" \
            --cache-control "public, max-age=300"

          # Activate the release last so clients never observe a partial rollout.
          echo -n "${tag}" > /tmp/version-pointer
          aws s3 cp /tmp/version-pointer "s3://heygen-public/cli/stable" \
            --content-type "text/plain" \
            --cache-control "public, max-age=60"
