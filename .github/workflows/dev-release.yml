name: Dev Release

# On demand only. This used to also fire on every push to main, which tagged a
# prerelease per merge — 78 of them against 22 stable releases, nearly all with
# zero downloads. Worse, those tags sat between stable releases and became the
# baseline GoReleaser computed the changelog from, so v0.7.0 published notes
# covering one commit instead of five. Dev builds are still available whenever
# someone wants one; they just are not minted automatically.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit SHA on main to release (empty: main as it is when the job starts)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.version }}
      tag_push_attempted: ${{ steps.tag.outputs.push_attempted }}
      commit: ${{ steps.tag.outputs.commit }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.commit || 'main' }}

      # A pinned commit is what was reviewed; refusing anything not on main keeps
      # a typo or a branch-only commit from being released.
      - name: Validate commit
        if: github.event.inputs.commit != ''
        shell: bash
        env:
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full 40-character SHA: $COMMIT" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "commit $COMMIT is not on main" >&2
            exit 1
          fi

      # Go version comes from go.mod's `go` directive; see ci.yml for why it lives there.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Compute dev version
        id: compute
        shell: bash
        run: |
          set -euo pipefail

          latest_stable="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ -z "$latest_stable" ]]; then
            latest_stable="v0.0.0"
          fi

          base="$(echo "$latest_stable" | sed 's/^v//' | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')"
          version="v${base}-dev.$(date -u +%Y%m%d%H%M)"

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install GoReleaser
        run: .github/scripts/install-goreleaser.sh

      - name: Create git tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.compute.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated with this run's ID: cleanup-failed-release.sh deletes a tag
          # only when its message names the run that is cleaning up.
          git tag -a "$version" -m "Release ${version} by GitHub Actions run ${GITHUB_RUN_ID}"
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "push_attempted=true" >> "$GITHUB_OUTPUT"
          git push origin "$version"

      - name: Run GoReleaser
        run: goreleaser release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record this run's draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Assigned first: a failed command substitution inside echo would not
          # fail the step.
          release_id="$(.github/scripts/find-run-draft.sh "${{ steps.compute.outputs.version }}" "$GITHUB_RUN_ID")"
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"

  # A job rather than a step: a cancelled job skips its remaining steps, but a
  # dependent job with always() still runs. The script decides from the repo's
  # actual state what, if anything, to delete.
  cleanup-failed-release:
    needs: release
    if: always() && needs.release.result != 'success' && needs.release.outputs.tag_push_attempted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Remove the tag and any draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/cleanup-failed-release.sh "${{ needs.release.outputs.tag }}" "${{ needs.release.outputs.commit }}" "${{ github.run_id }}"

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By the ID the release job recorded, never by tag, so only this run's
      # draft can be published.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --jq '"published \(.tag_name) (draft=\(.draft), prerelease=\(.prerelease))"'
